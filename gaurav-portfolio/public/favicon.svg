<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#E7EDF5"/>
      <stop offset="100%" stop-color="#C8D2DC"/>
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B5CFF"/>
      <stop offset="100%" stop-color="#7621B0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background -->

  <rect width="1024" height="1024" fill="#0C0C0C"/>

  <!-- Purple Glow -->

  <circle
    cx="520"
    cy="510"
    r="250"
    fill="url(#purpleGlow)"
    opacity="0.12"
    filter="url(#glow)"
  />

  <!-- G -->

  <text
    x="300"
    y="620"
    font-family="Times New Roman, serif"
    font-size="520"
    fill="url(#silver)"
    filter="url(#glow)"
  >
    G
  </text>

  <!-- C -->

  <text
    x="470"
    y="700"
    font-family="Times New Roman, serif"
    font-size="420"
    fill="url(#silver)"
    filter="url(#glow)"
  >
    C
  </text>

</svg>